name: "Daily: Santé des données"

# Fraîcheur des données en base + état des workflows planifiés. Un seul email, et seulement
# s'il y a un problème. Tourne en fin de journée : GitHub lance les autres jobs avec des heures de retard.
on:
  schedule:
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_data_health.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
