name: "Daily: ProFoods Commentaires"

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  enrich-commentaires:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UNEMPLACEMENT_EMAIL: ${{ secrets.UNEMPLACEMENT_EMAIL }}
      UNEMPLACEMENT_PASSWORD: ${{ secrets.UNEMPLACEMENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 scripts/enrich_commentaires.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
