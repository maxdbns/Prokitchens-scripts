name: "ONCE: Apply growth tracking schema migration"

on:
  workflow_dispatch:

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet psycopg2-binary

      - name: Apply migration via session pooler (IPv4-reachable)
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import psycopg2

          password = os.environ.get("SUPABASE_DB_PASSWORD")
          if not password:
              print("❌ SUPABASE_DB_PASSWORD secret missing")
              exit(1)

          # Direct db.<ref>.supabase.co:5432 is unreachable from GitHub Actions runners
          # (verified: "Network is unreachable" — likely IPv6-only egress on that host).
          # The session pooler on AWS infra IS reachable (verified via raw TCP connect).
          dsn = (
              f"postgresql://postgres.hxjryfaakdpwfgseirik:{password}"
              f"@aws-0-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require"
          )

          try:
              conn = psycopg2.connect(dsn, connect_timeout=15)
              conn.autocommit = True
              cursor = conn.cursor()

              with open("prokitchens-app/migrations/20260907_add_growth_tracking.sql", "r") as f:
                  sql = f.read()

              print("Executing full migration file...")
              cursor.execute(sql)
              print("✅ Migration executed")

              cursor.execute("""
                SELECT COUNT(*) as total,
                       COUNT(growth_velocity_score) as with_score,
                       COUNT(google_trend_score) as with_trend
                FROM public.leads;
              """)
              total, with_score, with_trend = cursor.fetchone()
              print(f"✅ Verification: {total} leads total, {with_score} with growth_velocity_score column, {with_trend} with google_trend_score column")

              cursor.close()
              conn.close()
              print("\n✅ Migration applied successfully!")

          except Exception as e:
              print(f"❌ Error: {e}")
              exit(1)
          PYTHON_EOF
