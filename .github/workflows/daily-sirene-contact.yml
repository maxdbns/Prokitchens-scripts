name: "Daily: Sirene + Contact"

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  sirene-delta:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests rapidfuzz
      - run: python3 daily_sirene_delta.py

  enrich-contact:
    needs: sirene-delta
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - run: python3 enrich_contact.py
