name: "Daily: INPI Dirigeants"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  inpi-dirigeants:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INPI_USERNAME: ${{ secrets.INPI_USERNAME }}
      INPI_PASSWORD: ${{ secrets.INPI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 inpi_enrich_dirigeants.py
