name: "Daily: Backfill + Fix Names"

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backfill-etablissements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 backfill_etablissements.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}

  fix-lead-names:
    needs: backfill-etablissements
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 fix_lead_names.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
