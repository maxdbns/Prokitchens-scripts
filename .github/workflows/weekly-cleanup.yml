name: "Weekly: INSEE Sync + Cleanup"

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  insee-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: maxdbns/Prokitchens
          ssh-key: ${{ secrets.PROKITCHENS_APP_SSH_KEY }}
          path: prokitchens-app
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd prokitchens-app && npm ci --ignore-scripts
      - run: cd prokitchens-app && npx tsx scripts/run-insee-sync.ts
      - if: failure()
        uses: actions/checkout@v5
        with:
          path: ci-scripts
      - if: failure()
        run: python3 ci-scripts/scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}

  cleanup-closed-sirets:
    needs: insee-sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 cleanup_closed_sirets.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}

  cleanup-closed-leads:
    needs: cleanup-closed-sirets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python3 cleanup_closed_leads.py
      - if: failure()
        run: python3 scripts/notify_workflow_failure.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
